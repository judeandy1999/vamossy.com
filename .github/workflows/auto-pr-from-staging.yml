name: Auto PR from staging to main

on:
  pull_request:
    types:
      - closed
    branches:
      - staging

jobs:
  create-pr:
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Authenticate GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | gh auth login --with-token

      - name: Auto-create PR to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh pr list --base main --head staging --state open | grep -q staging; then
            echo "PR from staging to main already exists."
          else
            gh pr create \
              --base main \
              --head staging \
              --title "Release to Production - $(date +'%Y-%m-%d')" \
              --body "Auto-generated PR from staging to main." \
              --draft
